// Minecraft-facing module: wires the pure-Kotlin :core into Fabric 1.21.1.
plugins {
    id 'fabric-loom'
    id 'org.jetbrains.kotlin.jvm'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { name = 'FabricMC'; url = 'https://maven.fabricmc.net/' }
    maven { name = 'JitPack'; url = 'https://jitpack.io' }
    maven { name = 'wispforest'; url = 'https://maven.wispforest.io/releases/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:${fabric_kotlin_version}"

    // owo-ui: screens are XML models under assets/jukz/owo_ui, hot-reloaded in dev (see JukzUiScreen).
    // Players install owo-lib like fabric-api; the tiny sentinel JiJ explains it if it is missing.
    modImplementation "io.wispforest:owo-lib:${owo_version}"
    include "io.wispforest:owo-sentinel:${owo_version}"

    // The deterministic core. include() jar-in-jars it so it ships inside the mod.
    implementation project(':core')
    include project(':core')

    // Coroutines for the client join coordinator (runBlocking). fabric-language-kotlin ships the
    // same artifact at runtime; declaring it keeps it on the compile classpath.
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:${coroutines_version}"

    // JGit world-sync (Maven Central, EDL-1.0, Java 17+), jar-in-jar'd so a normal install has it. Of
    // its dependencies only JavaEWAH is missing from the game: Minecraft already ships slf4j and
    // commons-codec.
    implementation "org.eclipse.jgit:org.eclipse.jgit:7.1.0.202411261347-r"
    include "org.eclipse.jgit:org.eclipse.jgit:7.1.0.202411261347-r"
    include "com.googlecode.javaewah:JavaEWAH:1.2.3"

    // ---- FLAGGED network libs (NAT traversal — requires live-network testing + shading) ----
    // MC ships its own Netty; ice4j + netty-codec-native-quic MUST be shaded/relocated to
    // avoid classpath clashes. Left out of the active build so the scaffold compiles offline;
    // the adapters (IceTransport / HolePuncher) document the exact calls and are wired behind
    // core interfaces, so enabling these is additive — the fallback for routers without UPnP.
    // implementation "org.jitsi:ice4j:3.2-15-g6da2b08"                  // STUN/ICE/TURN + UPnP
    // implementation "io.netty:netty-codec-native-quic:4.2.9.Final"    // reliable UDP tunnel

    // ---- Tests (JUnit5; Loom keeps Minecraft on the test classpath for sidecar/NBT round-trips) ----
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:${coroutines_version}"
}

loom {
    // Single source set; client-only classes are guarded with @Environment(CLIENT).

    // Two isolated client run configs for testing jukz host <-> guest on ONE machine.
    // Each gets its own runDir (separate logs / saves / config / jukz.nodeid -> distinct peers)
    // and a fixed username so the two windows are easy to tell apart in logs.
    // Launch:  gradlew runClientA   and   gradlew runClientB   (or run-client-a.bat / run-client-b.bat).
    runs {
        // Dev runs point owo-ui's hot reload at the XML in src/, so saving a screen's model redraws it
        // in-game immediately (JukzUiScreen watches the file). Never set outside dev runs.
        configureEach {
            vmArg "-Djukz.uiSourceDir=${file('src/main/resources/assets/jukz/owo_ui').absolutePath}"
        }
        clientA {
            inherit client
            name "Client A (jukz host)"
            runDir "run/clientA"
            programArgs "--username", "HostA"
        }
        clientB {
            inherit client
            name "Client B (jukz guest)"
            runDir "run/clientB"
            programArgs "--username", "GuestB"
        }
        // For playing from a checkout (see ../jugar): game folder, name and memory come from -P flags.
        //   gradlew runPlay -Pjukz.runDir=run/nob -Pjukz.username=Nob -Pjukz.ram=4G
        play {
            inherit client
            name "Play (jukz)"
            runDir(project.findProperty("jukz.runDir") ?: "run/play")
            programArgs "--username", (project.findProperty("jukz.username") ?: "Player")
            vmArg "-Xmx${project.findProperty("jukz.ram") ?: "4G"}"
        }
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

kotlin {
    jvmToolchain(21)
}

test {
    useJUnitPlatform()
    testLogging { events "passed", "skipped", "failed" }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
    // One catalog for the Worker and the mod (the live copy replaces this one once fetched).
    from(rootProject.file("cosmetics/catalog.json")) { into "assets/jukz/cosmetics" }
    // What's new, for the "jukz was updated" screen.
    from(rootProject.file("CHANGELOG.md")) { into "assets/jukz" }
}
