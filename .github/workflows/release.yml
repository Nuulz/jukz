# Publishing a GitHub release (tag vX.Y.Z) builds the mod at that version, runs the tests and attaches
# jukz-X.Y.Z.jar to the release, ready to drop into a Fabric 1.21.1 mods folder. If the release notes are
# empty, they are filled from CHANGELOG.md. "Run workflow" builds the current branch as a test, keeping
# the jar as a workflow artifact without touching any release.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 25 runs Gradle (Loom 1.18); 21 compiles the 1.21.x jars.
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: v
        run: |
          if [ "${{ github.event_name }}" = release ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^mod_version=//p' gradle.properties)-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "jukz $version"

      - name: Build and test
        run: bash gradlew build -Pmod_version=${{ steps.v.outputs.version }}

      - name: Jar
        id: jar
        run: |
          # One jar per Minecraft version: fabric/versions/<mc>/build/libs/jukz-<version>+<mc>.jar
          mkdir -p dist
          for jar in fabric/versions/*/build/libs/jukz-${{ steps.v.outputs.version }}+*.jar; do
            case "$jar" in *-sources.jar) continue ;; esac
            unzip -l "$jar" | grep -q 'META-INF/jars/org.eclipse.jgit' # the jar must carry its dependencies
            cp "$jar" dist/
          done
          ls dist/*.jar
          echo "path=dist/*.jar" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: jukz-${{ steps.v.outputs.version }}
          path: ${{ steps.jar.outputs.path }}

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release upload "$TAG" dist/*.jar --clobber
          if [ -z "$(gh release view "$TAG" --json body -q .body)" ]; then
            awk -v v="## $VERSION" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
            if [ -s notes.md ]; then
              # Which file is which: a player who grabs the wrong jar gets Fabric's "incompatible mods" screen.
              {
                printf '\n## Download the jar for your Minecraft version\n\n| Minecraft | File | Java |\n|---|---|---|\n'
                for jar in $(ls dist/*.jar | sort -V); do
                  mc="${jar##*+}"; mc="${mc%.jar}"
                  case "$mc" in 2[6-9].*|[3-9][0-9].*) java=25 ;; *) java=21 ;; esac
                  printf '| %s | `%s` | %s |\n' "$mc" "${jar##*/}" "$java"
                done
                printf '\nDrop it into `mods/`, next to Fabric API, Fabric Language Kotlin and owo-lib. Only one jukz jar at a time.\n'
              } >> notes.md
              gh release edit "$TAG" --notes-file notes.md
            fi
          fi

  # The same jars on Modrinth and CurseForge, one version per Minecraft version. Needs, in the repo's
  # Settings → Secrets and variables → Actions: secrets MODRINTH_TOKEN and CURSEFORGE_TOKEN, variables
  # MODRINTH_ID and CURSEFORGE_ID (the project ids). A store whose token or id is missing is skipped.
  stores:
    needs: jar
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["1.21.1", "1.21.11", "26.2"]
    steps:
      - uses: actions/checkout@v4

      - name: Jar and notes
        id: f
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          mkdir -p dist
          gh release download "$TAG" -p "jukz-${version}+${{ matrix.mc }}.jar" -D dist
          awk -v v="## $version" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          case "${{ matrix.mc }}" in 2[6-9].*) java=25 ;; *) java=21 ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "java=$java" >> "$GITHUB_OUTPUT"

      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/*.jar
          name: jukz ${{ steps.f.outputs.version }} for ${{ matrix.mc }}
          version: ${{ steps.f.outputs.version }}+${{ matrix.mc }}
          version-type: release
          changelog-file: notes.md
          loaders: fabric
          game-versions: ${{ matrix.mc }}
          java: ${{ steps.f.outputs.java }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
            fabric-language-kotlin(required){modrinth:Ha28R6CL}{curseforge:308769}
            owo-lib(required){modrinth:ccKDOlHs}{curseforge:532610}
            modmenu(optional){modrinth:mOgUt4GM}{curseforge:308702}
          fail-mode: warn
