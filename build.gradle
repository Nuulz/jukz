// Root project: declares plugin versions for the subprojects.
// Loom is applied only in :fabric (per Minecraft version, by loom-back-compat); :core is plain
// Kotlin/JVM so it builds and tests without the Minecraft toolchain on the classpath.
plugins {
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}" apply false
}

allprojects {
    repositories {
        mavenCentral()
    }
}

// Compiled with a current Kotlin, but against the 2.0 standard library, so players with an older
// fabric-language-kotlin (>= 1.12, Kotlin 2.0) still load the mod.
subprojects {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompilationTask).configureEach {
        compilerOptions {
            apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_0
            languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_0
        }
    }
}
